name: gherkin-format

on:
  pull_request:
    paths:
      - 'gherkin/**'
      - '.prettierrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gherkin-format.yml'

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run format:check
