name: mockserver-build

# Smoke-test that the mock backend image builds on every PR. Never pushes.
on:
  pull_request:
    paths:
      - 'mockserver/**'
      - 'docker-compose.yaml'
      - '.github/workflows/mockserver-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mock backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: mockserver
          file: mockserver/Dockerfile
          push: false
