name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Image name under the registry org. Change here (and in docker-compose.yaml)
  # if you rename the published image.
  IMAGE_NAME: dynatrace/fm-provider-mock-server

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release commit, tag and GitHub release
      pull-requests: write # create/update the release PR
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT (or GitHub App token) so the release PR triggers CI and the
          # release tag triggers downstream workflows. Falls back to the built-in
          # token, which works but will NOT trigger checks on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_ACTION_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag_name: ${{ steps.release.outputs.tag_name }}

  build-push:
    name: build and push image to GHCR
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_tag_name }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mock server image
        uses: docker/build-push-action@v6
        with:
          context: mockserver
          file: mockserver/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.release_tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
